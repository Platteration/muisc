# Android
compileSdk = "35"
minSdk = "26"
targetSdk = "35"
composeBom = "2025.01.01"
activityCompose = "1.10.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
media3 = "1.5.1"
room = "2.6.1"
datastore = "1.1.2"
coil = "2.7.0"
ksp = "2.1.20-1.0.32"
coreKtx = "1.15.0"
palette = "1.0.0"
work = "2.10.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

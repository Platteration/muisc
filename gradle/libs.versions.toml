[versions]
kotlin = "2.1.20"
agp = "8.7.3"
coroutines = "1.10.1"
serialization = "1.8.0"
clikt = "5.0.3"
junit = "5.11.4"
mp3spi = "1.9.5.4"
jflac = "1.5.2"

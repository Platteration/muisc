name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine modules and the CLI: every unit and contract test, the golden
  # corpus and the analysis bench. The Android app is left out on purpose
  # (settings.gradle.kts includes :app only when asked or when an SDK is
  # found, and GitHub's runners have one): its build needs the Android
  # toolchain and nothing here runs it.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew --no-daemon test
        env:
          MUISC_ANDROID: "false"
